name: Objeo Android native - APK preview
on:
  push:
    branches: [android-native]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo versions
        run: npx expo install --check
      - name: Bundle JavaScript
        run: npx expo export --platform android --output-dir dist
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone preview APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Collect APK and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: Objeo-native-preview
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 7
