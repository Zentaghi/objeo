name: Générer les icônes Android Objeo
on:
  push:
    branches: [prepare-android-pwa]
    paths:
      - scripts/objeo-icon-source.b64
      - .github/workflows/objeo-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare-android-pwa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Générer les icônes
        run: |
          python - <<'PY'
          from PIL import Image
          import base64, io, pathlib
          folder = pathlib.Path('assets')
          folder.mkdir(exist_ok=True)
          source = base64.b64decode(pathlib.Path('scripts/objeo-icon-source.b64').read_text().strip())
          image = Image.open(io.BytesIO(source)).convert('RGBA')
          for size, name in ((192, 'icon-192.png'), (512, 'icon-512.png'), (180, 'apple-touch-icon.png')):
              image.resize((size, size), Image.Resampling.LANCZOS).save(folder / name, optimize=True)
          PY
      - name: Commiter les PNG générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Ajouter les icônes PNG Android et iOS Objeo"
            git push
          fi
