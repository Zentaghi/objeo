<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes objets — Objeo</title><style>body{font:16px system-ui;background:#fff8f3;color:#26313b;margin:0}main{max-width:650px;margin:30px auto;padding:22px;background:white;border-radius:20px}a{color:#c6530d}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:8px}button{padding:12px 16px;border:0;border-radius:9px;background:#ff6e14;color:white;font-weight:700;cursor:pointer}.item{border-top:1px solid #eee;padding:16px 0}.item button{background:#444}#message{color:#b34b12}</style></head><body><main><a href="/">← Objeo</a><h1>🔐 Mes objets</h1><p>Enregistrez vos objets en privé. Vous pourrez les déclarer perdus plus facilement. Les alertes automatiques ne sont pas encore activées.</p><p id="message"></p><section id="content" hidden><form id="form"><label>Objet<input name="title" required minlength="2" maxlength="100" placeholder="Mon portefeuille noir"></label><label>Catégorie<select name="category"><option>Clés</option><option>Portefeuille</option><option>Téléphone</option><option>Ordinateur</option><option>Sac</option><option>Bijoux</option><option>Autre</option></select></label><label>Ville habituelle<input name="city" maxlength="100"></label><label>Description privée<textarea name="description" maxlength="1000"></textarea></label><button type="submit">Enregistrer l'objet</button></form><h2>Mes objets enregistrés</h2><div id="items"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://cvsecsmaczyadidapuyi.supabase.co','sb_publishable_btaX4jgtCGbB4piFnoiJfQ_JZkFMN2P',{auth:{storageKey:'sb-cvsecsmaczyadidapuyi-auth-token',persistSession:true,autoRefreshToken:true}});let user=null;
const msg=t=>document.getElementById('message').textContent=t;
async function init(){const r=await sb.auth.getUser();user=r.data?.user;if(!user){msg('Connectez-vous depuis Objeo avant d’utiliser Mes objets.');return}document.getElementById('content').hidden=false;await refresh()}
async function refresh(){const root=document.getElementById('items');root.textContent='Chargement…';const {data,error}=await sb.from('objeo_saved_objects').select('id,title,category,city,description').eq('owner_id',user.id).order('created_at',{ascending:false});if(error){msg('La base privée doit être activée dans Supabase.');root.textContent='';return}root.replaceChildren();if(!data.length)root.textContent='Aucun objet enregistré.';for(const item of data){const box=document.createElement('div');box.className='item';const title=document.createElement('strong');title.textContent=item.title;const detail=document.createElement('p');detail.textContent=[item.category,item.city,item.description].filter(Boolean).join(' · ');const lost=document.createElement('a');lost.href='/?publier=perdu';lost.textContent='🚨 J’ai perdu cet objet';const remove=document.createElement('button');remove.type='button';remove.textContent='Supprimer';remove.style.marginLeft='15px';remove.onclick=async()=>{if(!confirm('Supprimer cet objet ?'))return;const {error}=await sb.from('objeo_saved_objects').delete().eq('id',item.id).eq('owner_id',user.id);if(error)msg(error.message);else refresh()};box.append(title,detail,lost,remove);root.append(box)}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!user)return;const f=e.target;const {error}=await sb.from('objeo_saved_objects').insert({owner_id:user.id,title:f.elements.title.value.trim(),category:f.elements.category.value,city:f.elements.city.value.trim(),description:f.elements.description.value.trim()});if(error)msg('Erreur : '+error.message);else{f.reset();msg('Objet enregistré en privé.');refresh()}};init();
</script></body></html>
