<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications Objeo</title><style>body{font:16px system-ui;color:#202938;background:#f6f7fa;margin:0}main{max-width:520px;margin:32px auto;padding:24px;background:white;border-radius:18px}button,a{color:#b94a00}button{display:block;margin:12px 0;padding:14px;border:1px solid #ddd;border-radius:12px;background:white;font:inherit}button:disabled{opacity:.5}#status{overflow-wrap:anywhere}</style></head><body><main><a href="/">← Objeo</a><h1>Notifications</h1><p>Activez les alertes sur cet appareil. Sur iPhone, ajoutez d'abord Objeo à l'écran d'accueil puis ouvrez-le depuis son icône.</p><button id="enable" disabled>Activer les notifications</button><button id="test" disabled>Envoyer une notification de test</button><button id="disable" disabled>Désactiver sur cet appareil</button><p id="status" role="status">Vérification…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://cvsecsmaczyadidapuyi.supabase.co','sb_publishable_btaX4jgtCGbB4piFnoiJfQ_JZkFMN2P');
const $=id=>document.getElementById(id);let reg,user,key;
const status=t=>$('status').textContent=t;
async function call(action){const {data,error}=await sb.functions.invoke('objeo-push',{body:{action}});if(error)throw error;return data}
function bytes(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))}
async function refresh(){const sub=await reg.pushManager.getSubscription();$('enable').disabled=false;$('disable').disabled=!sub;$('test').disabled=!sub;status(sub?'Abonnement présent sur cet appareil.':'Notifications non activées.')}
async function run(fn){for(const id of ['enable','disable','test'])$(id).disabled=true;try{await fn()}catch(e){status(e.message||'Erreur');$('enable').disabled=false;$('disable').disabled=false;$('test').disabled=false}}
$('enable').onclick=()=>run(async()=>{if(Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted')throw Error('Autorisation refusée.');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes(key)});const j=sub.toJSON();const {error}=await sb.from('push_subscriptions').upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});if(error)throw error;await refresh();status('Notifications activées.');});
$('disable').onclick=()=>run(async()=>{const sub=await reg.pushManager.getSubscription();if(sub){const {error}=await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);if(error)throw error;await sub.unsubscribe()}await refresh()});
$('test').onclick=()=>run(async()=>{const d=await call('test');await refresh();status('Envois acceptés : '+d.sent+' ; échecs : '+d.failed)});
(async()=>{try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Notifications non disponibles dans ce navigateur.');const {data}=await sb.auth.getUser();user=data.user;if(!user)throw Error('Connectez-vous sur Objeo puis revenez ici.');reg=await navigator.serviceWorker.register('/sw.js');reg=await navigator.serviceWorker.ready;key=(await call('key')).publicKey;await refresh();if(new URLSearchParams(location.search).get('activate')==='1'&&Notification.permission==='granted'){history.replaceState(null,'','/notifications.html');$('enable').click()}}catch(e){status(e.message)}})();
</script></body></html>
