<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Objeo</title><meta name="robots" content="noindex">
<style>body{font:16px system-ui,sans-serif;background:#fff8f2;color:#27313e;max-width:560px;margin:60px auto;padding:24px;text-align:center}a{display:inline-block;padding:14px 20px;background:#ff6e14;color:#fff;border-radius:12px;text-decoration:none;font-weight:700}</style>
</head><body><h1>Messagerie Objeo</h1><p>Vos conversations sont maintenant regroupées dans la messagerie principale.</p><a id="go" href="/?pro_messages=1">Ouvrir mes messages</a>
<script>
const params=new URLSearchParams(location.search);
const to=new URL('/',location.origin);
if(params.has('objet'))to.searchParams.set('pro_objet',params.get('objet'));
else if(params.has('conversation'))to.searchParams.set('pro_conversation',params.get('conversation'));
else to.searchParams.set('pro_messages','1');
document.getElementById('go').href=to.href;
location.replace(to.href);
</script></body></html>
