<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objeo Protect · Laboratoire</title><style> *{box-sizing:border-box}body{margin:0;background:#faf7f4;color:#26313d;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}a{color:#bd500e}button,input{font:inherit;border:1px solid #ddd;border-radius:10px;padding:10px}button{cursor:pointer;background:white}button.primary{background:#c65008;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}article,section{background:white;border:1px solid #eee;border-radius:18px;padding:20px;margin:12px 0}small{color:#68717a}h1{font-size:36px}b.price{font-size:25px}.hero{background:#fff0e5;padding:24px;border-radius:20px}.symbol{font-size:40px} [hidden]{display:none!important}</style></head><body><main><a href="/admin.html">← Administration</a><p id="status" role="status">Vérification des droits…</p><div id="shop" hidden><div class="hero"><small>LABORATOIRE PRIVÉ · AUCUNE VENTE RÉELLE</small><h1>Objeo Protect</h1><p>Protégez ce qui compte.</p></div><div class="grid" id="catalog"></div><section><h2>Panier de simulation</h2><div id="cart"></div><p id="total"></p><button class="primary" id="order">Simuler une commande</button></section><section><h2>Commandes fictives</h2><p>Uniquement en mémoire pendant cette session.</p><div id="orders"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const el=id=>document.getElementById(id),sb=supabase.createClient('https://cvsecsmaczyadidapuyi.supabase.co','sb_publishable_btaX4jgtCGbB4piFnoiJfQ_JZkFMN2P');const products=[{name:'Objeo Key',icon:'🔑',desc:'Porte-clés QR unique',price:590,stock:100},{name:'Objeo Card',icon:'💳',desc:'Porte-cartes protégé',price:1290,stock:50},{name:'Objeo Tag',icon:'🏷️',desc:'Cinq étiquettes QR',price:690,stock:100},{name:'Objeo Pack',icon:'📦',desc:'Collection complète',price:1990,stock:30}];const cart=[0,0,0,0];let allowed=false;const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n/100);function render(){if(!allowed)return;el('catalog').replaceChildren();el('cart').replaceChildren();let sum=0;products.forEach((p,i)=>{const a=document.createElement('article');a.innerHTML='<div class="symbol">'+p.icon+'</div><h2>'+p.name+'</h2><p>'+p.desc+'</p><b class="price">'+money(p.price)+'</b><p>Stock fictif : '+p.stock+'</p>';const b=document.createElement('button');b.textContent='Ajouter au panier';b.disabled=cart[i]>=p.stock;b.onclick=()=>{cart[i]++;render()};a.append(b);el('catalog').append(a);if(cart[i]){const row=document.createElement('p');row.textContent=p.name+' × '+cart[i]+' — '+money(p.price*cart[i])+' ';const remove=document.createElement('button');remove.textContent='−';remove.onclick=()=>{cart[i]--;render()};row.append(remove);el('cart').append(row);sum+=p.price*cart[i]}});el('total').textContent='Total : '+money(sum);el('order').disabled=!sum}
el('order').onclick=()=>{if(!allowed||!cart.some(Boolean))return;const p=document.createElement('p');p.textContent='TEST '+new Date().toLocaleString('fr-FR')+' · '+products.map((x,i)=>cart[i]?x.name+' × '+cart[i]:null).filter(Boolean).join(', ')+' · '+money(products.reduce((s,x,i)=>s+x.price*cart[i],0));el('orders').prepend(p);products.forEach((x,i)=>{x.stock-=cart[i];cart[i]=0});render()};
async function gate(){try{const {data}=await sb.auth.getUser();if(!data.user)throw Error('Connexion requise');const {error}=await sb.rpc('objeo_admin_dashboard');if(error)throw error;allowed=true;el('shop').hidden=false;el('status').textContent='Mode simulation administrateur';render()}catch(e){allowed=false;el('shop').hidden=true;el('status').textContent='Accès administrateur requis.'}}sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){allowed=false;el('shop').hidden=true;el('status').textContent='Session fermée.'}});gate();</script></body></html>
