<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modération — Objeo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202938;background:#f5f6f9}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e5e7eb;padding:17px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between}a{color:#ed6719}main{max-width:1100px;margin:auto;padding:26px 18px}h1{margin:0 0 8px}p{color:#64748b}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:22px 0}.stat,.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:17px}.stat b{font-size:28px;display:block;margin-top:8px}.stat small{color:#64748b}.panel{margin:18px 0}button{border:1px solid #d6dbe3;border-radius:9px;background:white;padding:9px 12px;cursor:pointer;font-weight:600}button.primary{background:#ed6719;border-color:#ed6719;color:white}button.danger{color:#b42318;border-color:#ffc9c9}button:disabled{opacity:.5;cursor:wait}input{padding:11px;border:1px solid #d6dbe3;border-radius:9px;max-width:100%;width:320px}article{border-top:1px solid #e5e7eb;padding:14px 0;overflow-wrap:anywhere}article:first-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.muted{color:#64748b;font-size:13px}.error{color:#b42318}nav{display:flex;gap:8px;flex-wrap:wrap}nav button.active{background:#1f2937;color:white}#status{min-height:25px}#gate{max-width:620px}.hidden{display:none}</style></head><body><header><strong>🟠 Objeo · Administration</strong><a href="/">← Retour au site</a></header><main><h1>Centre de modération</h1><p>Accès privé réservé aux administrateurs autorisés dans Supabase.</p><div id="status" role="status">Vérification de votre session…</div><section id="gate" class="panel hidden"><h2>Connexion requise</h2><p>Connectez-vous à votre compte Objeo sur le site principal, puis revenez ici.</p><a href="/">Se connecter à Objeo</a></section><div id="dashboard" class="hidden"><div class="stats" id="stats"></div><nav><button class="active" data-tab="reports">Signalements</button><button data-tab="ads">Annonces</button><button data-tab="audit">Historique</button><button id="refresh">↻ Actualiser</button></nav><section id="reports" class="panel"></section><section id="ads" class="panel hidden"><h2>Annonces</h2><input id="filter" placeholder="Rechercher une annonce, une ville…"><div id="adsList"></div></section><section id="audit" class="panel hidden"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const URL='https://cvsecsmaczyadidapuyi.supabase.co',KEY='sb_publishable_btaX4jgtCGbB4piFnoiJfQ_JZkFMN2P';
let sb=null;const $=id=>document.getElementById(id);let state={};
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=String(text??'');if(cls)n.className=cls;return n}
function setStatus(t,bad=false){$('status').textContent=t;$('status').className=bad?'error':''}
function fmt(t){return t?new Date(t).toLocaleString('fr-FR'):'—'}
function actionButton(text,action,id,cls,note){const b=el('button',text,cls);b.onclick=async()=>{if(!confirm('Confirmer : '+text+' ?'))return;b.disabled=true;const {error}=await sb.rpc('objeo_admin_moderate',{p_action:action,p_target:id,p_note:note||null});if(error){setStatus(error.message,true);b.disabled=false;return}await load()};return b}
function render(){const d=state;$('stats').replaceChildren();[['Utilisateurs',d.users],['Annonces',d.ads],['Signalements en attente',d.pending_reports],['Revendications',d.claims],['Acceptées',d.accepted_claims],['Comptes suspendus',d.suspended_users]].forEach(([label,val])=>{const n=el('div','','stat');n.append(el('small',label),el('b',val));$('stats').append(n)});
const rp=$('reports');rp.replaceChildren(el('h2','Signalements'));if(!d.reports?.length)rp.append(el('p','Aucun signalement'));(d.reports||[]).forEach(r=>{const a=el('article');a.append(el('strong',r.ad_title||'Annonce supprimée'),el('div',r.reason+' · '+r.status+' · '+fmt(r.created_at),'muted'),el('p',r.details||'Sans précision'));if(r.status==='pending'){const actions=el('div','','actions');actions.append(actionButton('✓ Traité','review_report',r.id),actionButton('Ignorer','dismiss_report',r.id));if(r.ad_title)actions.append(actionButton('Supprimer l’annonce','delete_ad',r.ad_id,'danger'));a.append(actions)}rp.append(a)});
const al=$('adsList');al.replaceChildren();const filter=$('filter').value.toLowerCase();(d.ads_list||[]).filter(a=>(a.title+' '+a.city+' '+a.id).toLowerCase().includes(filter)).forEach(a=>{const node=el('article');node.append(el('strong',a.title),el('div',(a.kind==='found'?'Trouvé':'Perdu')+' · '+(a.city||'Ville inconnue')+' · '+fmt(a.created_at)+(a.suspended?' · COMPTE SUSPENDU':''),'muted'));const buttons=el('div','','actions');buttons.append(actionButton('Supprimer','delete_ad',a.id,'danger'));if(a.suspended)buttons.append(actionButton('Réactiver le compte','unsuspend_user',a.user_id));else buttons.append(actionButton('Suspendre le compte','suspend_user',a.user_id,'danger','Modération Objeo'));node.append(buttons);al.append(node)});
const au=$('audit');au.replaceChildren(el('h2','Historique des actions'));(d.audit||[]).forEach(a=>{const n=el('article');n.append(el('strong',a.action),el('div',a.target_id+' · '+fmt(a.created_at),'muted'));au.append(n)})}
async function load(){setStatus('Chargement des données…');const {data,error}=await sb.rpc('objeo_admin_dashboard');if(error){$('dashboard').classList.add('hidden');$('gate').classList.remove('hidden');setStatus(error.code==='42501'?'Accès administrateur refusé. Votre compte doit être autorisé dans Supabase.':error.message,true);return}state=data;$('gate').classList.add('hidden');$('dashboard').classList.remove('hidden');render();setStatus('Données actualisées · '+new Date().toLocaleTimeString('fr-FR'))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['reports','ads','audit'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});$('filter').oninput=()=>render();$('refresh').onclick=load;
async function ensureSupabase(){if(window.supabase?.createClient)return;for(const src of ['https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js']){try{await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.head.append(script)});if(window.supabase?.createClient)return}catch(e){console.warn('Supabase CDN indisponible',e)}}throw new Error('Impossible de charger Supabase. Vérifiez votre connexion ou désactivez temporairement un bloqueur de contenu.')}
async function initAdmin(){const watchdog=setTimeout(()=>{if($('status').textContent.includes('Vérification'))setStatus('Connexion trop lente. Actualisez la page ou ouvrez-la dans Safari.',true)},10000);try{await ensureSupabase();sb=window.supabase.createClient(URL,KEY);const session=await Promise.race([sb.auth.getUser(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Délai de connexion dépassé. Réessayez dans Safari.')),12000))]);if(!session.data?.user){$('gate').classList.remove('hidden');setStatus('Connectez-vous à Objeo, puis revenez sur cette page.');return}await load()}catch(e){$('gate').classList.remove('hidden');setStatus(e.message||'Erreur de connexion à Supabase',true);console.error('Objeo admin init',e)}finally{clearTimeout(watchdog)}}
initAdmin();
</script></body></html>
