const sb=supabase.createClient('https://cvsecsmaczyadidapuyi.supabase.co','sb_publishable_btaX4jgtCGbB4piFnoiJfQ_JZkFMN2P',{auth:{storageKey:'sb-cvsecsmaczyadidapuyi-auth-token'}}),el=id=>document.getElementById(id);

const names={mini:'Autocollant mini',standard:'Autocollant standard',maxi:'Autocollant maxi',rect:'Autocollant rectangle',badge:'Objeo Badge',travel:'Objeo Travel',stickpack:'Pack Stick',essential:'Pack Essential',complete:'Pack Complete',family:'Pack Family'};

function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function icon(name){const n=node('span',undefined,'icon');n.setAttribute('aria-hidden','true');n.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(icons[name]||icons.bag)+'</svg>';return n}
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0)/100);
const date=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

function render(data){const root=el('orders');root.replaceChildren();el('modeNotice').textContent=data.some(o=>o.payment_mode==='stripe_live')?'Historique des commandes · tests identifiés séparément':'Mode test · Aucun débit ni colis réel';el('orderCount').textContent='('+data.length+')';if(!data.length){const n=node('section',undefined,'empty'),a=node('a','Découvrir les accessoires','action primary');a.href='/boutique.html';n.append(icon('bag'),node('h2','Aucune commande pour le moment'),node('p','Vos prochaines commandes apparaîtront ici.','muted'),a);root.append(n);return}for(const o of data){const live=o.payment_mode==='stripe_live';const card=node('article',undefined,'order'),body=node('div',undefined,'order-body'),head=node('div',undefined,'order-head'),ref=node('div');ref.append(node('p',(live?'OBJ-':'TEST-')+o.id.slice(0,8).toUpperCase(),'ref'),node('p',date(o.date),'date'));head.append(ref,node('div',money(o.total),'total'));body.append(head);
const pay=node('div',undefined,'pay'),method=node('span',undefined,'pay-kind'+(['stripe_test','stripe_live'].includes(o.payment_mode)?' confirmed':''));method.append(icon(['stripe_test','stripe_live'].includes(o.payment_mode)?'check':'clock'),node('span',live?'Paiement confirmé':o.payment_mode==='stripe_test'?'Stripe test confirmé':'Commande simulée'));pay.append(method,node('span',labels[o.status]||o.status,'state state-'+o.status));body.append(pay);
const sequence=['pending','prepared','shipped','delivered'],idx=sequence.indexOf(o.status);if(idx>=0){const track=node('div',undefined,'track');track.setAttribute('aria-label','Suivi de commande');for(let i=0;i<sequence.length;i++){const step=node('div',undefined,'track-item'+(i<=idx?' done':'')+(i<idx?' passed':'')+(i===idx?' current':''));if(i===idx)step.setAttribute('aria-current','step');const dot=node('span',undefined,'dot');dot.append(icon(i<idx?'check':['bag','box','truck','home'][i]));step.append(dot,node('span',['Enregistrée','Préparée','Expédiée','Livrée'][i]));track.append(step)}body.append(track)}body.append(node('p',(live&&o.status==='shipped'?'Votre commande est en cours de livraison.':live&&o.status==='delivered'?'Votre commande est livrée. Activez vos accessoires.':next[o.status])||'Suivi indisponible.','next'));
const items=node('div',undefined,'items');for(const l of o.lines||[]){const row=node('div',undefined,'item'),pic=node('div',undefined,'thumb'),desc=node('div');pic.append(icon(l.sku==='standard'||l.sku==='mini'?'qr':'box'));desc.append(node('div',names[l.sku]||l.sku,'item-name'),node('div','Quantité : '+l.qty,'muted'));row.append(pic,desc);if(Number.isFinite(Number(l.price)))row.append(node('span',money(Number(l.price)*Number(l.qty)),'item-price'));items.append(row)}body.append(items);card.append(body);
if(o.tracking||o.delivered_at){const d=node('details',undefined,'extra');d.append(node('summary','Suivi de livraison'));const t=node('div',undefined,'tracking');if(o.carrier)t.append(node('p','Transporteur : '+o.carrier));if(o.tracking){t.append(node('p',(live?'Numéro de suivi : ':'Référence de suivi fictive : ')+o.tracking));const copy=node('button','Copier la référence','btn');copy.type='button';copy.onclick=async()=>{try{await navigator.clipboard.writeText(o.tracking);copy.textContent='Copié'}catch{copy.textContent='Copie indisponible'}};t.append(copy)}if(o.delivered_at)t.append(node('p',(live?'Livrée le ':'Livraison de test : ')+date(o.delivered_at),'muted'));d.append(t);card.append(d)}
if(['shipped','delivered'].includes(o.status)){const d=node('details',undefined,'extra');d.open=o.status==='delivered';d.append(node('summary','Mes accessoires ('+(o.accessories||[]).length+')'),node('p','Utilisez le code privé fourni séparément avec chaque accessoire.','muted'));const group=node('div',undefined,'accessories');for(const x of o.accessories||[]){const row=node('div',undefined,'accessory'),label=node('div');label.append(node('strong',(x.position?'N° '+x.position+' · ':'')+(x.product||'Accessoire Protect')),node('span',x.activated?'Activé':'À activer','muted'));const a=node('a',x.activated?'Gérer':'Activer','action '+(x.activated?'':'primary'));a.href='/protect-scan.html?tag='+encodeURIComponent(x.id);row.append(label,a);group.append(row)}if(!(o.accessories||[]).length)group.append(node('p','Aucun accessoire disponible pour le moment.','muted'));d.append(group);card.append(d)}root.append(card)}}
let loading=false;async function load(){if(loading)return;loading=true;el('reload').disabled=true;el('guest').hidden=true;try{const a=await sb.auth.getUser();if(!a.data?.user){el('orders').replaceChildren();el('toolbar').hidden=true;el('guest').hidden=false;notice('','');return}const r=await sb.rpc('objeo_protect_lab_customer_orders');if(r.error)throw r.error;const orders=r.data||[];render(orders);el('toolbar').hidden=false;notice('','');const mode=new URLSearchParams(location.search).get('stripe');if(['test','live'].includes(mode)){let draft=null;try{draft=JSON.parse(sessionStorage.getItem('objeo-stripe-draft')||'null')}catch{}if(draft){const state=await sb.rpc('objeo_protect_stripe_my_status',{p_request:draft.request_id});if(!state.error&&state.data?.status==='paid'){try{sessionStorage.removeItem('objeo-stripe-draft');sessionStorage.removeItem('objeo-protect-cart')}catch{}notice('success',mode==='live'?'Paiement confirmé':'Paiement de test confirmé',mode==='live'?'Votre commande est enregistrée. Vous pourrez suivre sa préparation ici.':'Votre commande est enregistrée et ses QR ont été générés. Aucun débit réel.')}else if(!state.error&&state.data?.status==='expired'){notice('error','Réservation expirée','Retournez à la boutique pour recommencer.')}else notice('pending','Confirmation en attente','Actualisez cette page pour vérifier la réception du paiement.')}}}catch(e){notice('error','Impossible de charger les commandes',e.message||'Veuillez réessayer.');el('toolbar').hidden=false}finally{loading=false;el('reload').disabled=false}}el('reload').onclick=load;sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT'||e==='SIGNED_IN')setTimeout(load,0)});window.addEventListener('pageshow',e=>{if(e.persisted)load()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});notice('pending','Chargement de vos commandes');load();
