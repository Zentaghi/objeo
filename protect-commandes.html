<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Mes commandes Protect · Objeo</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f2;color:#26313b;font:16px system-ui}main{max-width:720px;margin:auto;padding:24px 16px 60px}a{color:#a94a10}header{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:32px;letter-spacing:-1px}section,article{background:white;border:1px solid #eddfd3;border-radius:20px;padding:20px;margin:16px 0}button,.action{display:inline-block;background:#ff6e14;color:#222;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#fff;border:1px solid #ddd}.muted{color:#68717c;font-size:14px}.badge{display:inline-block;background:#fff0e4;color:#9e480f;padding:7px 12px;border-radius:30px;font-weight:700;font-size:13px}.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.step{padding:8px;border-radius:8px;background:#f1f2f3;color:#69727b;font-size:13px}.step.done{background:#ffe8d7;color:#8a410e}.accessory{padding:12px 0;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap} [hidden]{display:none!important}h2{font-size:20px}li{margin:8px 0}</style></head><body><main><header><a href="/" style="font-size:26px;font-weight:900;color:#ff6e14;text-decoration:none">Objeo.</a><a href="/mes-objets.html">Mes objets</a></header><h1>Mes commandes Protect</h1><p class="muted">Espace client de test · Aucun paiement ni colis réel.</p><section id="guest" hidden><h2>Retrouvez vos commandes</h2><p>Connectez-vous avec le compte Objeo associé à votre commande.</p><a class="action" href="/?account=1&protectOrders=1&authmode=login">Se connecter</a> <a class="action secondary" href="/?account=1&protectOrders=1&authmode=signup">S’inscrire</a></section><p id="status" role="status">Chargement…</p><div id="orders"></div><button id="reload" class="secondary" hidden>Actualiser</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://cvsecsmaczyadidapuyi.supabase.co','sb_publishable_btaX4jgtCGbB4piFnoiJfQ_JZkFMN2P',{auth:{storageKey:'sb-cvsecsmaczyadidapuyi-auth-token'}}),el=id=>document.getElementById(id);
const names={mini:'Autocollant mini',standard:'Autocollant standard',maxi:'Autocollant maxi',rect:'Autocollant rectangle',badge:'Badge',travel:'Étiquette valise',stickpack:'Pack Stick',essential:'Pack Essential',complete:'Pack Complete',family:'Pack Family'},labels={pending:'Enregistrée',prepared:'Préparée',shipped:'Expédition simulée',cancelled:'Annulée'};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function render(data){const root=el('orders');root.replaceChildren();for(const o of data){const card=node('article'),title=node('h2','Commande TEST-'+o.id.slice(0,8).toUpperCase()),status=node('span',labels[o.status]||o.status,'badge');card.append(title,status,node('p',new Date(o.date).toLocaleDateString('fr-FR')+' · '+new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(o.total/100)+' (simulation)','muted'));const steps=node('div',undefined,'steps'),order=['pending','prepared','shipped'];if(o.status!=='cancelled')for(const s of order)steps.append(node('span',labels[s],'step'+(order.indexOf(s)<=order.indexOf(o.status)?' done':'')));card.append(steps);const list=node('ul');for(const l of o.lines||[])list.append(node('li',(names[l.sku]||l.sku)+' × '+l.qty));card.append(list);if(o.tracking)card.append(node('p','Référence de suivi fictive : '+o.tracking));if(o.status==='shipped'){card.append(node('h2','Mes accessoires'),node('p','Utilisez le code privé fourni séparément avec chaque accessoire. Ne le publiez jamais.','muted'));for(const x of o.accessories||[]){const row=node('div',undefined,'accessory');row.append(node('span',(x.position?'N° '+x.position+' · ':'')+(x.product||'Accessoire Protect')+' · '+(x.activated?'Activé':'À activer')));const a=node('a',x.activated?'Gérer':'Activer','action');a.href='/protect-scan.html?tag='+encodeURIComponent(x.id);row.append(a);card.append(row)}}root.append(card)}}
async function load(){el('orders').replaceChildren();el('status').textContent='Chargement…';el('guest').hidden=true;el('reload').hidden=true;try{const a=await sb.auth.getUser();if(!a.data?.user){el('guest').hidden=false;el('status').textContent='';return}const r=await sb.rpc('objeo_protect_lab_customer_orders');if(r.error)throw r.error;render(r.data||[]);el('status').textContent=r.data?.length?'':'Aucune commande de test associée à ce compte.';el('reload').hidden=false}catch(e){el('status').textContent=e.message||'Chargement impossible';el('reload').hidden=false}}el('reload').onclick=load;sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')setTimeout(load,0)});load();
</script></body></html>
